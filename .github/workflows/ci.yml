name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # main's branch protection requires a check named "test"
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: current
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx mcpb validate manifest.json
      - run: scripts/release.sh build --all
