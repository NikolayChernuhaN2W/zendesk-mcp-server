name: Release

# Runs when the owner pushes a version tag with scripts/release.sh tag
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: current
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check the tag matches package.json
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! parsed=$(node --input-type=module -e "
            import { parseVersion } from './scripts/release-lib.mjs';
            try { console.log(parseVersion(process.argv[1])); }
            catch (error) { console.log(error.message); process.exit(1); }
          " "$version"); then
            echo "::error::$parsed"
            exit 1
          fi
          version="$parsed"
          package_version=$(node -p "require('./package.json').version")
          if [ "$version" != "$package_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json's version $package_version. Merge a PR made with scripts/release.sh prepare $version, then tag that commit."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build both variants
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node scripts/release.mjs --version "$VERSION"
          node scripts/release.mjs --version "$VERSION" --allow-writes
      - name: Publish the GitHub Release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release.mjs --notes "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.mcpb --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md" "${prerelease[@]}"
